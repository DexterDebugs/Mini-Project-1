<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Placement Management System</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="dashboard.css">
    <script src="scripts/dashboard.js" defer></script>
</head>
<body>
    <div class="dashboard-container">
        <aside class="sidebar">
            <h2>Dashboard</h2>
            <nav>
                <div><button class="sidebar-btn" data-section="home"> <i class="fas fa-home"></i> Home</button></div>
                <div><button class="sidebar-btn" data-section="academics"> <i class="fas fa-book"></i> Academics</button></div>
                <div><button class="sidebar-btn" data-section="applied"> <i class="fas fa-file-alt"></i> Applied</button></div>
                <div><button class="sidebar-btn" data-section="placed"> <i class="fas fa-briefcase"></i> Placed</button></div>
                <div><button class="sidebar-btn" data-section="profile"> <i class="fas fa-user"></i> Profile</button></div>
                <div><button class="sidebar-btn" data-section="settings"> <i class="fas fa-cog"></i> Settings</button></div>
                <div><button class="sidebar-btn logout"><i class="fas fa-sign-out-alt"></i> Logout</button></div>
            </nav>
        </aside>

        <main class="main-content" id="content">
            <!-- Dynamic sections load here -->
        </main>
    </div>
</body>
</html>
