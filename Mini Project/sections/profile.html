<div id="profile-section">
    <h2 class="section-title">Profile</h2>

    <div class="profile-container">
        <div class="profile-pic-container">
            <label for="file-upload">
                <img id="profile-pic" src="images/default-profile.jpg" alt="Profile Picture">
            </label>
            <input type="file" id="file-upload" accept="image/*" onchange="previewImage(event)">
        </div>

        <form id="profile-form">
            <label for="name">Full Name</label>
            <input type="text" id="name" placeholder="Enter your name">

            <label for="email">Email</label>
            <input type="email" id="email" placeholder="Enter your email">

            <label for="phone">Phone</label>
            <input type="tel" id="phone" placeholder="Enter your phone number">

            <label for="bio">Bio</label>
            <textarea id="bio" placeholder="Write something about yourself..."></textarea>

            <button type="submit" class="profile-btn">Update Profile</button>
        </form>
    </div>
</div>
<script>
    function previewImage(event) {
        const reader = new FileReader();
        reader.onload = function () {
            const imgElement = document.getElementById('profile-pic');
            imgElement.src = reader.result;
        };
        reader.readAsDataURL(event.target.files[0]);
    }
    </script>
